# Question Bank for Adaptive Tutor Agent
# Structure: topics -> tiers -> list of question templates
# Template variables: {topic} is replaced at render time

python:
  beginner:
    - template: "What is a variable in Python?"
      answer_keywords: ["variable", "store", "value", "name", "assign"]
      hint: "Think about how Python stores data."
    - template: "What does the print() function do in Python?"
      answer_keywords: ["output", "display", "console", "screen", "print"]
      hint: "It's used to show something to the user."
    - template: "Name two basic data types in Python."
      answer_keywords: ["int", "str", "float", "bool", "integer", "string", "boolean"]
      hint: "Think about numbers and text."
  intermediate:
    - template: "Explain how list comprehensions work in Python."
      answer_keywords: ["list", "comprehension", "loop", "expression", "iterate", "filter"]
      hint: "They provide a concise way to create lists."
    - template: "What is the difference between a list and a tuple in Python?"
      answer_keywords: ["mutable", "immutable", "list", "tuple", "change", "modify"]
      hint: "Consider whether you can change them after creation."
    - template: "How do decorators work in Python?"
      answer_keywords: ["decorator", "function", "wrap", "modify", "@", "higher-order"]
      hint: "They modify the behavior of functions."
  advanced:
    - template: "Explain Python's Global Interpreter Lock (GIL) and its implications for multi-threading."
      answer_keywords: ["GIL", "thread", "lock", "CPython", "parallel", "concurrent", "mutex"]
      hint: "Consider how Python manages memory across threads."
    - template: "Describe the difference between generators and iterators in Python."
      answer_keywords: ["generator", "iterator", "yield", "lazy", "next", "__iter__", "__next__"]
      hint: "Think about memory efficiency and lazy evaluation."
    - template: "How does Python's memory management and garbage collection work?"
      answer_keywords: ["reference counting", "garbage collection", "memory", "gc", "cycle", "refcount"]
      hint: "Python uses reference counting as its primary mechanism."

