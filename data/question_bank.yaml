    - template: "Explain the concept of a mathematical function."
      answer_keywords: ["function", "input", "output", "map", "relation", "domain", "range"]
      hint: "Think about how inputs are mapped to outputs."
  advanced:
    - template: "Explain the fundamental theorem of calculus."
      answer_keywords: ["integral", "derivative", "antiderivative", "differentiation", "integration", "inverse"]
