[metadata]
name = adaptive-tutor-agent
version = 0.1.0
description = Adaptive tutor agent with spaced repetition, difficulty routing, and persistent learner memory
author = Tutor Agent
python_requires = >=3.9

[options]
packages = find:
install_requires =
    pyyaml>=6.0
    openai>=1.0.0

[options.entry_points]
console_scripts =
    tutor-agent = tutor_agent.cli:main

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0

[tool:pytest]
testpaths = tests
addopts = --tb=short --cov=tutor_agent --cov-report=term-missing
